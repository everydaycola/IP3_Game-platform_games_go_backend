spring.application.name=go-backend
server.port=8082

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true

spring.datasource.url=jdbc:postgresql://localhost:5443/postgres?currentSchema=go
spring.datasource.username=user
spring.datasource.password=password

#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.data-locations=classpath:sql/data.sql

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/FourteenGames
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/FourteenGames/protocol/openid-connect/certs

cors.allowed-origins=http://localhost:5173,http://localhost:5175